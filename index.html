function n(){if(window.Peer||i>=u.length)return;var s=document.createElement('script');s.src=u[i++];s.onload=function(){if(!window.Peer)n();};s.onerror=n;document.head.appendChild(s);}

<script>
'use strict';
/* =========================================================
   골판지 듀오 : 대결 (v2.0)
   - 운 요소 0 · 모든 조건 대칭 · 오직 실력
   - 로컬 2인 / 봇 연습 / 방 코드 온라인 (락스텝 동기화)
   ========================================================= */
const BUILD='pvp-2.14';
const W=960,H=540,FLOOR=440;
const FONT='system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);          // 시각 효과 전용 (게임 규칙에는 절대 쓰지 않음)
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

/* ---------- 캔버스 · 오류 처리 ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SC=1,OX=0,OY=0,DPR=1,SW=960,SH=540,ANIM=0;
let PORTRAIT=false,portraitOK=false,ROT_BTN=null;
const ERR={msg:'',until:0,n:0};
function reportErr(e){try{ERR.msg=String((e&&e.message)||e).slice(0,70);ERR.until=performance.now()+7000;if(ERR.n++<5)console.error(e);}catch(_){}}
window.addEventListener('error',ev=>reportErr(ev.error||ev.message));
window.addEventListener('unhandledrejection',ev=>{try{ev.preventDefault();}catch(_){}reportErr(ev.reason);});
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);SW=window.innerWidth;SH=window.innerHeight;
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  SC=Math.min(SW/W,SH/H);OX=(SW-W*SC)/2;OY=(SH-H*SC)/2;PORTRAIT=SH>SW*1.15;
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);resize();

/* ---------- 앱 상태 ---------- */
const APP={scene:'menu',mode:'bot',paused:false,showHelp:false,joinCode:'',
  cfg:{map:0,bo:2,w:[0,1],bot:1},      // bo = 먼저 N라운드 이기면 승리
  S:null,bots:[null,null],result:null,leaveArm:0,acc:0,rematch:[false,false],oppLeft:false,
  sk:[[],[]],ranked:false,rdy:[false,false],rkGoT:0,rkRes:null,rkWhy:'',coinGot:0,coinDone:0,vote:[0,0],rkN:0};

/* ---------- 소리 ---------- */
let AC=null,muted=false;const lastSfx={};
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){try{const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
}
function tone(f,d,type,v,slide){
  if(muted||!AC)return;
  try{const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const SFX={
  shoot:()=>tone(520,.05,'square',.014,-220),shotgun:()=>tone(200,.12,'sawtooth',.05,-120),lob:()=>tone(260,.15,'triangle',.05,-100),
  hit:()=>tone(240,.05,'triangle',.04),hurt:()=>tone(170,.25,'sawtooth',.06,-120),dash:()=>tone(300,.12,'sine',.05,300),
  jump:()=>tone(330,.1,'square',.02,200),boom:()=>tone(100,.4,'sawtooth',.07,-60),parry:()=>{tone(1250,.18,'sine',.08,-500);tone(1900,.1,'triangle',.04,-600);},
  pw:()=>tone(700,.05,'triangle',.02,200),ex:()=>tone(150,.4,'sawtooth',.07,500),ko:()=>{tone(120,.6,'sawtooth',.08,-60);},
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.07),i*120)),
  lose:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.07),i*160)),
  mark:()=>{tone(1400,.1,'square',.05);setTimeout(()=>tone(1400,.1,'square',.05),140);setTimeout(()=>tone(1800,.2,'square',.05),280);},snipe:()=>{tone(90,.5,'sawtooth',.09,-40);tone(1600,.12,'square',.04,-1200);},charged:()=>tone(1100,.12,'triangle',.04),
  pad:()=>tone(300,.18,'square',.04,900),lava:()=>tone(130,.2,'sawtooth',.06,-60),
  beep:()=>tone(660,.12,'square',.04),go:()=>tone(990,.3,'square',.05),
};
const SFX_GAP={shoot:.07,hit:.04,jump:.1,pw:.1};
function playSfx(c){const g=SFX_GAP[c]||0;if(g){const n=performance.now();if(n-(lastSfx[c]||0)<g*1000)return;lastSfx[c]=n;}if(SFX[c])SFX[c]();}

/* ---------- 입력 ---------- */
const KEYS=['l','r','u','d','jump','shoot','dash','lock','special','swap'];   // swap = 패링
const BIT={L:1,R:2,U:4,D:8,J:16,S:32,DA:64,LK:128,EX:256,PA:512,AIM:1024};
const SET1={l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',jump:'KeyF',shoot:'KeyG',dash:'KeyH',lock:'KeyR',special:'KeyT',swap:'KeyQ'};
const SET2={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',jump:'Period',shoot:'Slash',dash:'Comma',lock:'Semicolon',special:'Quote',swap:'KeyL'};
const ALT={jump:'Space',shoot:'KeyJ',dash:'KeyK',lock:'ShiftLeft',special:'KeyU',swap:'KeyI'};
const keys={},latch={},tlatch={};
const usedCodes=new Set([...Object.values(SET1),...Object.values(SET2),...Object.values(ALT),'Escape','Space']);
const bitsOf=(set)=>{let b=0;KEYS.forEach((k,n)=>{if(set[k]&&(keys[set[k]]||latch[set[k]]))b|=1<<n;});return b;};
function readPad(i){
  let b=0;const pads=(navigator.getGamepads&&navigator.getGamepads())||[];const gp=pads[i];if(!gp)return 0;
  const bp=n=>gp.buttons[n]&&gp.buttons[n].pressed;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  if(ax<-.4||bp(14))b|=BIT.L;if(ax>.4||bp(15))b|=BIT.R;if(ay<-.4||bp(12))b|=BIT.U;if(ay>.4||bp(13))b|=BIT.D;
  if(bp(0))b|=BIT.J;if(bp(2)||bp(7))b|=BIT.S;if(bp(1))b|=BIT.DA;if(bp(4)||bp(6))b|=BIT.LK;if(bp(3))b|=BIT.EX;if(bp(5))b|=BIT.PA;
  return b;
}
const IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
const tp=new Map();let touchBits=0;
const PTR={x:-1,y:-1,down:false,touch:false};
function tLayout(){
  const u=Math.min(SH,SW*.62)/100;
  return{u,stick:{x:Math.max(19*u,SW*.12),y:SH-25*u,r:14*u},btns:[
    {k:'shoot',b:BIT.S,x:SW-15*u,y:SH-21*u,r:11*u,l:'조준'},{k:'jump',b:BIT.J,x:SW-36*u,y:SH-12.5*u,r:9*u,l:'점프'},
    {k:'dash',b:BIT.DA,x:SW-12*u,y:SH-46*u,r:8*u,l:'대시'},{k:'parry',b:BIT.PA,x:SW-33*u,y:SH-34*u,r:7.5*u,l:'패링'},
    {k:'ex',b:BIT.EX,x:SW-49*u,y:SH-24*u,r:7*u,l:'EX'},{k:'lock',b:BIT.LK,x:OX+(W-52)*SC,y:OY+140*SC,r:19*SC,l:'고정'}]};
}
/* ---------- 브롤스타즈식 조준: 끌어서 방향 잡고 → 놓으면 발사 ---------- */
const AIM={ptr:null,idx:0,ang:null,drag:false,was:false,keep:0,hold:0,pulse:0,mouse:false,mode:0};
try{AIM.mode=localStorage.getItem('aimMode')==='1'?1:0;}catch(_){}
function setAimMode(m){AIM.mode=m?1:0;try{localStorage.setItem('aimMode',String(AIM.mode));}catch(_){}}
const AIM_HOLD=[14,0,0,0,30,0,0,0,0,0];     // 놓았을 때 연속 사격 틱 수 (피스톨 2발, 화염 5번)
const mySlot=()=>APP.mode==='guest'?1:0;
function aimReset(){AIM.ptr=null;AIM.ang=null;AIM.idx=0;AIM.drag=false;AIM.was=false;AIM.keep=0;AIM.hold=0;AIM.pulse=0;AIM.mouse=false;}
const AIMN=256,TAU=Math.PI*2;
const idxFromAng=a=>((Math.round(a/TAU*AIMN)%AIMN)+AIMN)%AIMN;
function idxOf(dx,dy){return idxFromAng(Math.atan2(dy,dx));}
function lerpAng(a,b,k){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return a+d*k;}
// 자동 조준: 움직이는 상대를 예측해서 겨눔 · 포물선 무기는 맞는 각도를 계산 (라디안)
function smartAng(){
  const S=APP.S;if(!S)return 0;const me=S.p[mySlot()],o=S.p[1-mySlot()],w=me.w;
  const mx=me.x,my=me.y-30;let tx=o.x,ty=o.y-23;
  if(w===2||w===8){
    const sp=WP[w].sp;let best=0,bd=1e9;
    for(let i=0;i<AIMN;i+=2){
      let x=mx+AIMX[i]*26,y=my+AIMY[i]*26,vx=AIMX[i]*sp,vy=AIMY[i]*sp-2.5;
      for(let t=0;t<200;t++){x+=vx;y+=vy;vy+=.28;if(vy>0&&y>=ty){const tt=clamp(o.x+clamp(o.vx,-6,6)*(t+1)*.9,14,946),d=Math.abs(x-tt);if(d<bd){bd=d;best=i;}break;}if(y>FLOOR+30)break;}
    }
    if(bd<1e8)return best/AIMN*TAU;
  }
  const sp=w===3?21:(w===7?9:(WP[w].sp||12));
  for(let k=0;k<2;k++){const dd=Math.hypot(tx-mx,ty-my),t=dd/sp;tx=o.x+clamp(o.vx,-6,6)*t*.9;if(tx<14)tx=14;if(tx>946)tx=946;}
  return Math.atan2(ty-my,tx-mx);
}
// 지금 가리키는 목표 각도 (조준 중이 아니면 null)
function tgtAng(){
  if(AIM.ptr===null)return null;const o=tp.get(AIM.ptr);if(!o)return null;
  const S=APP.S;if(!S)return null;
  if(o.z==='maim'){
    const me=S.p[mySlot()],lx=(o.x-OX)/SC,ly=(o.y-OY)/SC,dx=lx-me.x,dy=ly-(me.y-30);
    AIM.drag=dx*dx+dy*dy>24*24;return AIM.drag?Math.atan2(dy,dx):smartAng();
  }
  if(AIM.drag)return Math.atan2(o.y-o.oy,o.x-o.ox);
  return smartAng();
}
// 화면 프레임마다 호출: 조준 각도를 부드럽게 따라가게 함 (끊김·떨림 완화)
function updateAim(dt){
  const t=tgtAng();if(t===null)return;
  if(AIM.ang===null)AIM.ang=t;else AIM.ang=lerpAng(AIM.ang,t,1-Math.exp(-dt*22));
  AIM.idx=idxFromAng(AIM.ang);
}
function aimLive(){return AIM.ptr!==null&&AIM.ang!==null?idxFromAng(AIM.ang):-1;}   // 지금 조준 중인 방향 (없으면 -1)
function finishAim(o){
  const S=APP.S;const w=S?S.p[mySlot()].w:0;
  if(o.z==='aim'&&AIM.was&&!AIM.drag&&w!==3){AIM.ptr=null;AIM.keep=0;AIM.was=false;AIM.ang=null;return;}   // 끌었다가 중앙으로 되돌리면 발사 취소
  const t=tgtAng();if(t!==null)AIM.ang=t;           // 놓는 순간은 손가락이 가리킨 방향으로 정확히 (지연 없음)
  const held=AIM.mode===1&&AIM.drag;                  // 연사 모드로 쏘고 있었으면 놓을 때 추가 발사 없음
  AIM.idx=AIM.ang===null?AIM.idx:idxFromAng(AIM.ang);AIM.ptr=null;AIM.keep=40;AIM.was=false;
  if(w!==3&&!held){AIM.pulse=1;AIM.hold=AIM_HOLD[w]||0;try{if(navigator.vibrate&&o.z==='aim')navigator.vibrate(12);}catch(_){}}
}
function aimBits(){
  const S=APP.S;const w=S?S.p[mySlot()].w:0;let b=0;
  if(AIM.ptr!==null){
    const i=aimLive();if(i>=0){AIM.idx=i;b|=BIT.AIM|(i<<11);if(w===3||(AIM.mode===1&&AIM.drag))b|=BIT.S;}   // 저격총은 누르는 동안 차징 · 연사 모드는 끌고 있는 동안 계속 발사
  }else if(AIM.keep>0){
    AIM.keep--;b|=BIT.AIM|(AIM.idx<<11);
    if(AIM.hold>0){b|=BIT.S;AIM.hold--;AIM.pulse=0;}else if(AIM.pulse){b|=BIT.S;AIM.pulse=0;}
  }
  return b;
}
function updateTouchBits(){
  touchBits=0;const L=tLayout();
  for(const o of tp.values()){
    if(o.z==='aim'){const R=L.btns[0].r*1.45,dx=o.x-o.ox,dy=o.y-o.oy;
      if(dx*dx+dy*dy>(R*.3)*(R*.3)){AIM.drag=true;AIM.was=true;}else AIM.drag=false;continue;}
    if(o.z==='maim')continue;
    if(o.z==='stick'){const dx=(o.x-o.ox)/L.stick.r,dy=(o.y-o.oy)/L.stick.r;
      if(dx<-.35)touchBits|=BIT.L;if(dx>.35)touchBits|=BIT.R;if(dy<-.4)touchBits|=BIT.U;if(dy>.4)touchBits|=BIT.D;}
    else if(o.z)touchBits|=o.z;
  }
}
function sampleLocal(){let b=bitsOf(SET1)|bitsOf(SET2)|bitsOf(ALT)|readPad(0)|touchBits|(tlatch.v|0);return b|aimBits();}   // 혼자/온라인
function sampleP1(){return bitsOf(SET1)|readPad(0)|touchBits|(tlatch.v|0)|aimBits();}
function sampleP2(){return bitsOf(SET2)|readPad(1);}
function clearLatch(){for(const k in latch)delete latch[k];tlatch.v=0;}

window.addEventListener('keydown',e=>{
  if(APP.scene==='join'){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Backspace'){APP.joinCode=APP.joinCode.slice(0,-1);e.preventDefault();return;}
    if(e.key==='Enter'){doJoin();e.preventDefault();return;}
    if(e.key==='Escape'){goMenu();return;}
    const ch=(e.key||'').toUpperCase();if(ch.length===1&&CODE_CHARS.includes(ch)&&APP.joinCode.length<5){APP.joinCode+=ch;net.status='';}
    return;
  }
  if(usedCodes.has(e.code))e.preventDefault();
  if(!keys[e.code])latch[e.code]=true;
  keys[e.code]=true;audio();
  if(e.code==='KeyM')muted=!muted;
  if(e.code==='Escape'||e.code==='KeyP'){
    if(APP.scene==='play'){if(APP.mode==='local'||APP.mode==='bot')APP.paused=!APP.paused;}
    else if(APP.scene==='menu'&&APP.showHelp)APP.showHelp=false;
  }
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('paste',e=>{
  if(APP.scene!=='join')return;
  const t=(((e.clipboardData&&e.clipboardData.getData('text'))||'')+'').toUpperCase().split('').filter(c=>CODE_CHARS.includes(c)).join('').slice(0,5);
  if(t){APP.joinCode=t;net.status='';}
});
function autoPause(){if(APP.scene==='play'&&(APP.mode==='local'||APP.mode==='bot'))APP.paused=true;}
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;autoPause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause();});
document.addEventListener('gesturestart',e=>e.preventDefault());

cv.addEventListener('pointerdown',e=>{
  audio();e.preventDefault();const sx=e.clientX,sy=e.clientY;
  PTR.touch=e.pointerType==='touch';PTR.down=true;PTR.x=(sx-OX)/SC;PTR.y=(sy-OY)/SC;
  if(PORTRAIT&&!portraitOK){
    if(ROT_BTN&&sx>=ROT_BTN.x&&sx<=ROT_BTN.x+ROT_BTN.w&&sy>=ROT_BTN.y&&sy<=ROT_BTN.y+ROT_BTN.h)portraitOK=true;
    return;
  }
  const lx=PTR.x,ly=PTR.y,pad=PTR.touch?8:0;
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(b.enabled&&lx>=b.x-pad&&lx<=b.x+b.w+pad&&ly>=b.y-pad&&ly<=b.y+b.h+pad){b.fn();return;}}
  if(APP.scene==='play'&&PTR.touch&&!APP.paused){
    const L=tLayout();let z=null,ox=0,oy=0;
    if(sx<SW*.4&&sy>SH*.3){z='stick';const near=dist(sx,sy,L.stick.x,L.stick.y)<L.stick.r*1.4;ox=near?L.stick.x:sx;oy=near?L.stick.y:sy;}
    else for(const b of L.btns){
      if(b.k==='shoot'){if(dist(sx,sy,b.x,b.y)<b.r*1.35){z='aim';ox=sx;oy=sy;AIM.ptr=e.pointerId;AIM.drag=false;AIM.was=false;AIM.ang=null;AIM.keep=0;AIM.hold=0;AIM.pulse=0;break;}continue;}
      if(dist(sx,sy,b.x,b.y)<b.r*1.3){z=b.b;tlatch.v=(tlatch.v|0)|b.b;break;}
    }
    tp.set(e.pointerId,{x:sx,y:sy,z,ox,oy});updateTouchBits();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  }else if(APP.scene==='play'&&!PTR.touch&&e.button===0&&!APP.paused&&!APP.oppLeft&&APP.S){   // 마우스: 누른 채 조준 → 떼면 발사
    tp.set(e.pointerId,{x:sx,y:sy,z:'maim',ox:0,oy:0});AIM.ptr=e.pointerId;AIM.mouse=true;AIM.drag=false;AIM.was=false;AIM.ang=null;AIM.keep=0;AIM.hold=0;AIM.pulse=0;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
  }
});
cv.addEventListener('pointermove',e=>{
  PTR.touch=e.pointerType==='touch';PTR.x=(e.clientX-OX)/SC;PTR.y=(e.clientY-OY)/SC;
  const o=tp.get(e.pointerId);if(o){o.x=e.clientX;o.y=e.clientY;updateTouchBits();}
});
const pEnd=e=>{PTR.down=false;if(e.pointerType==='touch'){PTR.x=-1;PTR.y=-1;}const ao=tp.get(e.pointerId);if(ao&&(ao.z==='aim'||ao.z==='maim')&&AIM.ptr===e.pointerId)finishAim(ao);if(tp.delete(e.pointerId))updateTouchBits();};
cv.addEventListener('pointerup',pEnd);cv.addEventListener('pointercancel',pEnd);
cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'){PTR.x=-1;PTR.y=-1;PTR.down=false;}});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* =========================================================
   대결 시뮬레이션 (결정론) — DOM·랜덤·삼각함수 사용 금지
   60틱/초 고정, 입력은 비트마스크 2개 → 상태 갱신
   ========================================================= */
/*SIM_BEGIN*/
const PV={FLOOR:440,GR:.55,JV:-11.4,MAXF:15,RUN:4.4,HW:12,PH:46,
  DASH_T:9,DASH_SP:9.5,DASH_CD:48,DASH_INV:3,PARRY_T:8,PARRY_CD:45,PARRY_HIT_CD:16,PARRY_R:32,
  HP:100,COUNT:180,FIGHT:3600,REND:150,EXMAX:100,PADV:-17,CHG_FULL:130,CHG_HALF:65,MARK_T:150,DT:1/60};
const WP=[
  {n:'피스톨',cd:10,sp:13,r:5,life:75,dmg:3,g:0},
  {n:'샷건',cd:40,sp:11,r:5,life:22,dmg:4,g:0},
  {n:'박격포',cd:50,sp:8,r:8,life:150,dmg:22,g:.28},
  {n:'저격총',cd:40,sp:21,r:4,life:45,dmg:22,g:0,k:4},

function stepFlame(S){

    if(S.orbCd>0)S.orbCd--;

  }
  for(let i=0;i<S.orbs.length;i++){
    const ob=S.orbs[i];ob.age++;
    for(let j=0;j<2;j++){
      const p=S.p[j];if(p.w!==4||p.hp<=0)continue;
      const dx=ob.x-p.x,dy=ob.y-(p.y-23);

        ob.age=99999;simEv(S,'orb',ob.x,ob.y,j);break;

  let w=0;for(let i=0;i<S.orbs.length;i++){if(S.orbs[i].age<1500)S.orbs[w++]=S.orbs[i];}S.orbs.length=w;
  for(let i=0;i<S.fires.length;i++){

    for(let i=0;i<2;i++){const q=S.p[i];if(q.ex<PV.EXMAX){q.ex+=.02;if(q.ex>PV.EXMAX)q.ex=PV.EXMAX;}}
    const a=S.p[0].hp<=0,b=S.p[1].hp<=0;
    if(a||b)endRound(S,'ko',a&&b?-1:(a?1:0));
    else if(S.pt<=0){const h0=S.p[0].hp,h1=S.p[1].hp;endRound(S,'time',h0>h1?0:(h1>h0?1:-1));}
  }else if(ph==='rend'){S.pt--;if(S.pt<=0)startRound(S);}
}
function simHash(S){
  let h=17;const f=v=>{h=(Math.imul(h,31)+(v|0))|0;};
  f(S.tick);f(S.pt);f(S.fightT);f(S.round);f(S.score[0]*7+S.score[1]);
  for(let i=0;i<2;i++){const p=S.p[i];f(p.x*64);f(p.y*64);f(p.vx*64);f(p.vy*64);f(p.hp);f(p.ex*64);f(p.cd);f(p.want);f(p.bq);f(p.hz);f(p.chg);f(p.mk);f(p.snUsed);f(p.dashT);f(p.pT);f(p.pCd);f(p.slow);f(p.fl);f(p.burn);}
  f(S.rng);f(S.orbs.length);f(S.fires.length);
  f(S.b.length);for(let i=0;i<S.b.length;i++){f(S.b[i].x*64);f(S.b[i].y*64);}
  return h;
}

function botMk(lv){return{lv,R:[28,13,5][lv]};}
function octBits(dx,dy,grounded){
  const ax=dx<0?-dx:dx,ay=dy<0?-dy:dy;let b=0;
  const horiz=ay<ax*.4142,vert=ax<ay*.4142;
  if(!vert)b|=dx>0?2:1;
  if(!horiz){if(dy<0)b|=4;else if(!grounded)b|=8;}
  return b;
}
function botThreat(S,me,bot){
  let best=99,bk=0;const cx=me.x,cy=me.y-23;
  for(let j=0;j<S.b.length;j++){
    const u=S.b[j];if(u.own===me.i||u.age<bot.R)continue;
    let x=u.x,y=u.y;const vx=u.vx;let vy=u.vy;
    const rr=u.r+15+(u.k===2?30:0);
    for(let t=1;t<=18;t++){
      x+=vx;y+=vy;vy+=u.g;const dx=x-cx,dy=y-cy;
      if(dx*dx+dy*dy<=rr*rr){if(t<best){best=t;bk=(u.ex||u.k===10)?3:u.k;}break;}
    }
  }
  return best<99?{t:best,k:bk}:null;
}
function botInput(S,i,bot){
  if(S.phase!=='fight')return 0;
  const me=S.p[i],o=S.p[1-i];let b=0;
  const MM=MAPS[S.map];
  if(MM.hz&&lavaPh(S)+((S.fightT+60)%LAVA_T>=LAVA_WARN&&(S.fightT+60)%LAVA_T<LAVA_END?1:0)>0&&me.y>=PV.FLOOR-2&&me.x>MM.hz[0]-30&&me.x<MM.hz[1]+30)return me.x<480?B_L:B_R;
  const ddx=o.x-me.x,ddy=(o.y-23)-(me.y-23),ad=ddx<0?-ddx:ddx;
  const w=me.w,lo=[230,90,150,320,40,160,120,200,160,160,200,150,170,120,160][w],hi0=[420,200,380,600,110,330,260,420,340,400,380,320,330,260,340][w],hi=w===4?100+me.fl*22:hi0;
  const dirb=ddx>0?2:1,away=ddx>0?1:2;
  if(w===4&&S.orbs.length&&me.hp>0){   // 화염 오브 먹으러 가기
    let bo=null,bd=1e9;for(const ob of S.orbs){const d=Math.abs(ob.x-me.x)+Math.abs(ob.y-me.y)*.5;if(d<bd){bd=d;bo=ob;}}
    if(bo&&bd<700&&(me.fl<4)&&ad>70){const ox=bo.x-me.x;let bb=ox>8?B_R:(ox<-8?B_L:0);if(bo.y<me.y-50&&me.onG&&(S.tick%20)<3)bb|=B_J;if(bo.y<me.y-50&&bo.y>=me.y-170&&ox>-50&&ox<50&&me.onG)bb|=B_J;return bb|(ad<hi?B_S:0)|octBits(ddx,ddy,me.onG)*0;}
  }
  const th=botThreat(S,me,bot);
  let evading=false;
  if(th){
    if(bot.lv>=2&&th.k!==3&&th.k!==7&&th.t<=6&&me.pCd<=0&&me.dashT<=0){b|=512;evading=true;}
    else if(bot.lv>=1&&th.t<=8&&me.dashCd<=0&&(me.onG||!me.airDash)){b|=64|dirb;evading=true;}
    else if(th.t<=12&&me.onG){b|=16;}
  }
  let aimb=octBits(ddx,ddy,me.onG);
  if((w===2||w===8)&&ad>240)aimb|=4;
  const gate=bot.lv===0?(((S.tick>>3)&3)!==0):(bot.lv===1?(((S.tick>>4)&7)!==0):true);
  if(!evading){
    if(ad>hi+60){b|=dirb;if((ddy<60&&ddy>-60)&&gate)b|=32;}
    else if(ad<lo*.8){
      const cornered=(away===1&&me.x<60)||(away===2&&me.x>900);
      if(cornered){b|=dirb|16;}else b|=away;
    }else{b|=aimb|128;if(gate)b|=32;}
    if(ddy<-70&&me.onG&&(S.tick%45)<3)b|=16;
    if(me.onG&&(S.tick%110)<9)b|=16;
    if(me.ex>=PV.EXMAX&&ad<520&&ad>60&&gate)b|=256;
    if(w===3){
      const al=ddy*ddy<28*28&&((ddx>0)===(me.face>0));
      if(me.chg>=PV.CHG_FULL&&o.mk>0&&o.mkBy===i&&al&&bot.lv>=1)b&=~32;
      else if(ad>lo*.8)b|=32;
    }
  }
  return b;
}

const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:5},()=>CODE_CHARS[(Math.random()*CODE_CHARS.length)|0]).join('');
const net={role:'none',peer:null,conn:null,code:'',status:'',connected:false,rtt:0,pings:[],pingIv:null,tries:0,verBad:false,hiSent:false,slot:-1,opp:null,oppSk:null,browse:[],rkSent:false,byeRecv:false};

  net.slot=-1;net.opp=null;net.oppSk=null;net.browse=[];net.rkSent=false;net.byeRecv=false;APP.ranked=false;APP.rdy=[false,false];APP.rkGoT=0;

}
const sendRk=()=>{net.rkSent=true;netSend({t:'rk',rp:RK.rp,sk:skStr(RK.sk),n:RK.name,id:RK.id,c:RK.coin});};
function sendCfg(){if(net.role==='host')netSend({t:'cfg',c:{map:APP.cfg.map,bo:APP.cfg.bo,w:[APP.cfg.w[0],APP.cfg.w[1]]}});}
function onPeerGone(){
  net.connected=false;net.conn=null;
  if(net.pingIv){clearInterval(net.pingIv);net.pingIv=null;}
  if(APP.ranked){
    const S=APP.S;APP.rkWhy='';

    }

  }
  if(APP.scene==='play'||APP.scene==='result'){APP.oppLeft=true;LS.on=false;}
  else if(net.role==='host'){net.status=APP.ranked?'도전자가 나갔어요. 다시 기다리는 중':'친구가 나갔어요. 다시 기다리는 중';}
  else if(net.role==='guest'){net.status='연결이 끊겼어요';}
}
function bindConn(conn){
  conn.on('data',netMsg);
  conn.on('close',onPeerGone);
  conn.on('error',()=>{});
}
function hostRoom(){
  if(typeof Peer==='undefined'){net.status='연결 라이브러리를 불러오지 못했어요 (인터넷 확인)';return;}
  try{if(net.peer)net.peer.destroy();}catch(e){}
  net.role='host';net.connected=false;net.conn=null;net.code=genCode();net.status='방을 만드는 중...';net.verBad=false;net.hiSent=false;
  let peer;try{peer=new Peer('cbduo-'+net.code);}catch(e){net.status='오류: '+((e&&e.message)||'연결 실패');return;}
  net.peer=peer;
  peer.on('open',()=>{net.status='친구를 기다리는 중';});
  peer.on('connection',conn=>{
    if(net.conn&&net.conn.open){try{conn.close();}catch(e){}return;}
    net.conn=conn;bindConn(conn);
    conn.on('open',()=>{net.connected=true;net.status='친구가 들어왔어요!';netSend({t:'hi',b:BUILD});sendRk();startPings();sendCfg();});
  });
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&net.tries<4){net.tries++;hostRoom();}
    else net.status='오류: '+err.type;
  });
}
function joinRoom(code){
  if(typeof Peer==='undefined'){net.status='연결 라이브러리를 불러오지 못했어요 (인터넷 확인)';return;}
  leaveNet(false);net.role='guest';net.code=code;net.status='연결 중...';
  let peer;try{peer=new Peer();}catch(e){net.status='오류: '+((e&&e.message)||'연결 실패');return;}
  net.peer=peer;
  const timer=setTimeout(()=>{if(!net.connected&&net.role==='guest')net.status='연결 시간 초과 — 코드를 확인해 주세요';},12000);
  peer.on('open',()=>{
    let conn;try{conn=peer.connect('cbduo-'+code,{serialization:'json',reliable:true});}catch(e){net.status='오류: 연결 실패';return;}
    net.conn=conn;bindConn(conn);
    conn.on('open',()=>{clearTimeout(timer);net.connected=true;net.status='연결됨';});
  });
  peer.on('error',err=>{net.status=err.type==='peer-unavailable'?'그 코드의 방이 없어요':'오류: '+err.type;});
}
function startPings(){
  let n=0;if(net.pingIv)clearInterval(net.pingIv);
  net.pingIv=setInterval(()=>{if(!net.connected||n>=8){clearInterval(net.pingIv);net.pingIv=null;return;}netSend({t:'ping',s:performance.now()});n++;},250);
}
function calcD(){
  const a=net.pings.slice().sort((x,y)=>x-y);if(!a.length)return 5;
  const med=a[a.length>>1],one=med/2;
  return clamp(Math.ceil(one/16.7)+2,3,9);
}
function netMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case'hi':
      if(m.b!==BUILD){net.verBad=true;net.status='버전이 달라요 — 두 사람 모두 새로고침(Ctrl+F5) 해 주세요';}
      if(net.role==='guest'&&!net.hiSent){net.hiSent=true;netSend({t:'hi',b:BUILD});if(!net.rkSent)sendRk();}
      break;
    case'ping':netSend({t:'pong',s:m.s});break;
    case'pong':{const r=performance.now()-(+m.s||0);if(r>=0&&r<5000){net.pings.push(r);net.rtt=Math.round(calcD()>0?net.pings.slice().sort((x,y)=>x-y)[net.pings.length>>1]:r);}break;}
    case'cfg':
      if(net.role==='guest'&&m.c&&Array.isArray(m.c.w)){
        APP.cfg.map=clamp(m.c.map|0,0,MAPS.length-1);APP.cfg.bo=m.c.bo===3?3:2;
        APP.cfg.w=[clamp(m.c.w[0]|0,0,WP.length-1),clamp(m.c.w[1]|0,0,WP.length-1)];
      }
      break;
    case'pick':if(net.role==='host'){if(APP.ranked&&APP.rdy[1]){sendCfg();break;}APP.cfg.w[1]=clamp(m.w|0,0,WP.length-1);sendCfg();rkResetReady();}break;
    case'rk':net.opp=rkParseOpp(m);net.oppSk=net.opp.sk;if(!net.rkSent)sendRk();break;
    case'mv':if(net.role==='host'&&APP.ranked&&!APP.rdy[1]){APP.vote[1]=clamp(m.m|0,0,MAPS.length-1);rkResolve();rkResetReady();}break;
    case'mvs':if(net.role==='guest'&&Array.isArray(m.v)){APP.vote=[clamp(m.v[0]|0,0,MAPS.length-1),clamp(m.v[1]|0,0,MAPS.length-1)];APP.rkN=m.n|0;}break;
    case'rdy':if(net.role==='host'&&APP.ranked){APP.rdy[1]=!!m.v;sendRdy();}break;
    case'rdys':if(net.role==='guest'&&Array.isArray(m.a))APP.rdy=[!!m.a[0],!!m.a[1]];break;
    case'go':
      if(net.role==='guest'&&m.c&&Array.isArray(m.c.w)){
        const c={map:clamp(m.c.map|0,0,MAPS.length-1),bo:m.c.bo===3?3:2,w:[clamp(m.c.w[0]|0,0,WP.length-1),clamp(m.c.w[1]|0,0,WP.length-1)],bot:1};
        startOnline(c,clamp(m.D|0,2,12),1);
      }
      break;
    case'pi':lsRecv(m);break;
    case'ck':lsCheck(m);break;
    case'rq':{const o=1-LS.slot;APP.rematch[o]=true;tryRematch();break;}
    case'lobby':if(APP.scene==='play'||APP.scene==='result'){LS.on=false;APP.scene=APP.ranked?'rklobby':'lobby';APP.oppLeft=false;APP.rdy=[false,false];APP.rkGoT=0;}break;
    case'bye':net.byeRecv=true;onPeerGone();break;
  }
}

const LS={on:false,slot:0,tick:0,D:4,nl:0,loc:{},rem:{},hist:[],own:{},theirs:{},desync:false,stall:0,lastRecv:0};
function lsInit(D,slot){
  LS.on=true;LS.slot=slot;LS.D=D;LS.tick=0;LS.nl=D;LS.loc={};LS.rem={};LS.hist=[];LS.own={};LS.theirs={};LS.desync=false;LS.stall=0;LS.lastRecv=performance.now();
  for(let i=0;i<D;i++){LS.loc[i]=0;LS.rem[i]=0;}
}
function lsSend(){if(!LS.hist.length)return;netSend({t:'pi',a:LS.hist[0][0],v:LS.hist.map(h=>h[1])});}
function lsRecv(m){
  if(!LS.on||!Array.isArray(m.v))return;
  const a=m.a|0;
  for(let i=0;i<m.v.length&&i<16;i++){const k=a+i;if(k>=LS.tick&&LS.rem[k]===undefined)LS.rem[k]=(m.v[i]|0)&0x7FFFF;}
  LS.lastRecv=performance.now();
}
function lsCheck(m){
  const k=m.k|0,h=m.h|0;
  if(LS.own[k]!==undefined){if(LS.own[k]!==h)LS.desync=true;delete LS.own[k];}
  else LS.theirs[k]=h;
}
function lsPump(dt){
  LS.acc=Math.min((LS.acc||0)+dt,.2);let n=0;
  while(LS.acc>=PV.DT&&n<6){
    while(LS.nl<=LS.tick+LS.D){
      const b=sampleLocal();clearLatch();LS.loc[LS.nl]=b;LS.hist.push([LS.nl,b]);if(LS.hist.length>8)LS.hist.shift();LS.nl++;lsSend();
    }
    const a=LS.loc[LS.tick],r=LS.rem[LS.tick];
    if(a===undefined||r===undefined){LS.stall++;break;}
    LS.stall=0;
    simStep(APP.S,LS.slot===0?[a,r]:[r,a]);
    delete LS.loc[LS.tick];delete LS.rem[LS.tick];LS.tick++;LS.acc-=PV.DT;n++;
    if(LS.tick%30===0){
      const h=simHash(APP.S);LS.own[LS.tick]=h;netSend({t:'ck',k:LS.tick,h});
      const t=LS.theirs[LS.tick];if(t!==undefined){if(t!==h)LS.desync=true;delete LS.theirs[LS.tick];delete LS.own[LS.tick];}
      for(const k in LS.own)if(+k<LS.tick-900)delete LS.own[k];
      for(const k in LS.theirs)if(+k<LS.tick-900)delete LS.theirs[k];
    }
    drainEv();
  }
  if(LS.stall>0&&LS.acc>.1)LS.acc=.1;
}

// 조준 예측선: 무기별 실제 탄 물리를 그대로 시뮬레이션 (포물선·튕김·로켓 가속·부메랑 반환점) / 상대에게 닿으면 빨간색
function aimPaths(S,me,idx){
  const w=me.w,ax=AIMX[idx],ay=AIMY[idx],mx=me.x+ax*26,my=me.y-30+ay*26,o=S.p[1-me.i];
  const P={sp:13,life:75,r:5,g:0,vy0:0,bounce:0,acc:0,rev:0,land:0,band:0};
  if(w===3)Object.assign(P,{sp:21,life:45,r:4});
  else if(w===1)Object.assign(P,{sp:11,life:22});
  else if(w===2)Object.assign(P,{sp:8,life:150,r:8,g:.28,vy0:-2.5,land:1});
  else if(w===4)Object.assign(P,{sp:6.5,life:FLV[me.fl|0].life,r:FLV[me.fl|0].r,band:1});
  else if(w===5)Object.assign(P,{sp:9,life:85,r:6,bounce:1});
  else if(w===6)Object.assign(P,{sp:10,life:90,r:9,rev:28});
  else if(w===7)Object.assign(P,{sp:5,life:90,r:9,acc:1,land:2});
  else if(w===8)Object.assign(P,{sp:7,life:140,r:7,g:.28,vy0:-2.5,land:1});
  else if(w===9)Object.assign(P,{sp:15,life:70,r:4});
  else if(w===10)Object.assign(P,{sp:6.5,life:110,r:6});
  else if(w===11)Object.assign(P,{sp:13,life:70});
  else if(w===12)Object.assign(P,{sp:7,life:22,r:7});
  else if(w===13)Object.assign(P,{sp:10,life:60,r:8});
  else if(w===14)Object.assign(P,{sp:9,life:70,r:5});
  const dirs=w===1?[-1,0,1]:[0];const out=[];let hit=false;
  for(const k of dirs){
    let dx=ax,dy=ay;if(k){const s=k*.19867,c=.98007;dx=ax*c-ay*s;dy=ax*s+ay*c;}
    let x=mx,y=my,vx=dx*P.sp,vy=dy*P.sp+P.vy0,bn=0;const pts=[[x,y]];let end=null;
    for(let t=1;t<=Math.min(P.life,240);t++){
      if(P.acc&&t<28){vx*=1.03;vy*=1.03;}
      const oy=y;x+=vx;y+=vy;vy+=P.g;
      if(P.bounce&&bn<3){
        if(x<8&&vx<0){x=8;vx=-vx;bn++;end=[x,y,'b'];}else if(x>952&&vx>0){x=952;vx=-vx;bn++;end=[x,y,'b'];}
        if(vy>0){if(y+P.r>=FLOOR){y=FLOOR-P.r;vy=-vy;bn++;end=[x,y,'b'];}
          else for(const pl of S.pl){if(x>pl[0]&&x<pl[0]+pl[2]&&oy+P.r<=pl[1]&&y+P.r>=pl[1]){y=pl[1]-P.r;vy=-vy;bn++;end=[x,y,'b'];break;}}}
        else if(y<20&&vy<0){y=20;vy=-vy;bn++;end=[x,y,'b'];}
      }
      pts.push([x,y]);
      if(x>o.x-12-P.r&&x<o.x+12+P.r&&y>o.y-46-P.r&&y<o.y+P.r){hit=true;if(!P.band)break;}
      if(x<-20||x>980||y<-120)break;
      if(P.land===1&&vy>0){let l=y+P.r>=FLOOR;if(!l)for(const pl of S.pl){if(x>pl[0]&&x<pl[0]+pl[2]&&oy+P.r<=pl[1]&&y+P.r>=pl[1]){l=true;break;}}if(l){end=[x,y,'l'];break;}}
      if(P.land===2){let l=y+P.r>=FLOOR;if(!l)for(const pl of S.pl){if(x>pl[0]&&x<pl[0]+pl[2]&&y>=pl[1]&&y<=pl[1]+14){l=true;break;}}if(l){end=[x,y,'l'];break;}}
      if(P.rev&&t>=P.rev){end=[x,y,'r'];break;}
    }
    out.push({pts,end});
  }
  return{paths:out,hit,band:P.band,r:P.r,w};
}

  ctx.restore();
}

// win: 1 승 / 0 패 / -1 무효(점수 변동 없음)
function rkSettle(win){
  const opp=RK.pend?RK.pendOpp:RK.rp,rp0=RK.rp,t0=tierIdx(rp0),b0=RK.best;let d=0;
  if(win===1){d=25+clamp(((opp-RK.rp)/20)|0,-10,10);RK.w++;RK.st++;if(RK.st>=3)d+=Math.min(5,RK.st-2);}
  else if(win===0){d=-(18+clamp(((RK.rp-opp)/20)|0,-10,10));if(d>-8)d=-8;RK.l++;RK.st=0;}
  RK.rp=clamp(RK.rp+d,0,9999);d=RK.rp-rp0;
  const t1=tierIdx(RK.rp);if(t1>RK.best)RK.best=t1;
  RK.pend=0;rkSave();
  const un=[];for(let s=1;s<SKINS.length;s++)if(!SKINS[s].box&&SKINS[s].t>b0&&SKINS[s].t<=RK.best)un.push(s);
  return{win,d,rp0,rp1:RK.rp,t0,t1,un};
}

let _fsDesc=null;const _skc={};
function skinMap(v,S){
  if(typeof v!=='string'||v.charAt(0)!=='#')return v;
  let r,g,b;
  if(v.length===7){r=parseInt(v.substr(1,2),16);g=parseInt(v.substr(3,2),16);b=parseInt(v.substr(5,2),16);}
  else if(v.length===4){r=parseInt(v.charAt(1),16)*17;g=parseInt(v.charAt(2),16)*17;b=parseInt(v.charAt(3),16)*17;}
  else return v;
  const L=(r*.3+g*.59+b*.11)/255;
  if(S.rainbow===2)return'hsl('+((((150+Math.sin(ANIM*2+L*4)*75)+360)%360)|0)+',90%,'+((38+L*34)|0)+'%)';
  if(S.rainbow)return'hsl('+(((ANIM*140+L*220)%360)|0)+',92%,'+((36+L*34)|0)+'%)';
  const k=v+S.n;if(_skc[k])return _skc[k];
  const m=(i)=>(S.lo[i]+(S.hi[i]-S.lo[i])*L)|0;
  return(_skc[k]='rgb('+m(0)+','+m(1)+','+m(2)+')');
}
function skinBegin(sk){
  const S=SKINS[sk|0];if(!sk||!S||!S.glow)return false;
  try{
    if(!_fsDesc)_fsDesc=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'fillStyle');
    const d=_fsDesc;
    Object.defineProperty(ctx,'fillStyle',{configurable:true,get(){return d.get.call(ctx);},set(v){d.set.call(ctx,skinMap(v,S));}});
    ctx.shadowColor=S.glow;ctx.shadowBlur=9;return true;
  }catch(e){return false;}
}
function skinEnd(on){if(!on)return;try{delete ctx.fillStyle;}catch(e){}ctx.shadowBlur=0;}

  ctx.save();ctx.beginPath();ctx.arc(0,0,r*.84,0,7);ctx.clip();ctx.strokeStyle='rgba(60,30,10,.2)';ctx.lineWidth=Math.max(2,r*.08);
  for(let i=-r;i<r;i+=r*.3){ctx.beginPath();ctx.moveTo(i,-r);ctx.lineTo(i,r);ctx.stroke();}ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.ellipse(-r*.3,-r*.5,r*.34,r*.14,-.6,0,7);ctx.fill();

function rkTrySlot(slot){
  if(net.role!=='host')return;
  if(slot>=RK_SLOTS){net.status='지금은 방이 가득 찼어요. 잠시 뒤 다시 시도해 주세요';return;}
  net.slot=slot;net.code='RK'+slot;net.status='방을 만드는 중...';
  let peer;try{peer=new Peer('cbduo-rk-'+slot);}catch(e){net.status='오류: '+((e&&e.message)||'연결 실패');return;}
  net.peer=peer;
  peer.on('open',()=>{if(net.peer===peer&&!net.connected)net.status='도전자를 기다리는 중';});
  peer.on('connection',c=>{if(net.peer===peer)rkHostConn(c);});
  peer.on('error',err=>{
    if(net.peer!==peer)return;
    if(err.type==='unavailable-id'){try{peer.destroy();}catch(e){}rkTrySlot(slot+1);}
    else net.status='오류: '+err.type;
  });
}
const rkInfo=()=>({t:'rinfo',b:BUILD,s:net.slot|0,rp:RK.rp,map:APP.vote[0],st:net.connected?1:0});
const mapRes=()=>APP.vote[0]===APP.vote[1]?APP.vote[0]:(APP.rkN%2===0?APP.vote[1]:APP.vote[0]);

  else{if(APP.rdy[1])return;APP.vote[1]=i;netSend({t:'mv',m:i});}
}
function rkPush(){if(!net.browse)return;for(const c of net.browse){try{if(c.open&&c!==net.conn)c.send(rkInfo());}catch(e){}}}
function rkHostConn(conn){
  if(!net.browse)net.browse=[];

}
function rkParseOpp(m){

const RKS={peer:null,conns:{},rooms:{},status:'',msg:'',t:0,joining:null,next:0};
function rkScanStop(){
  const p=RKS.peer;RKS.peer=null;
  for(const s in RKS.conns){try{RKS.conns[s].close();}catch(e){}}
  RKS.conns={};RKS.rooms={};RKS.joining=null;
  if(p){try{p.destroy();}catch(e){}}
}
function rkScanStart(){
  rkScanStop();RKS.status='방을 찾는 중...';RKS.msg='';RKS.t=performance.now();RKS.next=RKS.t+5000;
  if(typeof Peer==='undefined'){RKS.status='연결 라이브러리를 불러오지 못했어요 (인터넷 확인)';return;}
  let peer;try{peer=new Peer();}catch(e){RKS.status='오류: 연결 실패';return;}
  RKS.peer=peer;
  peer.on('open',()=>{if(RKS.peer===peer)rkScanRound();});
  peer.on('error',err=>{if(RKS.peer!==peer||err.type==='peer-unavailable')return;RKS.status='오류: '+err.type;});
}
function rkScanRound(){
  const peer=RKS.peer;if(!peer||peer.destroyed||peer.disconnected)return;
  for(let s=0;s<RK_SLOTS;s++){
    const old=RKS.conns[s];if(old)continue;
    let conn;try{conn=peer.connect('cbduo-rk-'+s,{serialization:'json',reliable:true});}catch(e){continue;}
    RKS.conns[s]=conn;
    conn.on('data',m=>rkConnMsg(conn,m,s));
    conn.on('close',()=>{if(RKS.conns[s]===conn)delete RKS.conns[s];if(RKS.rooms[s]&&RKS.rooms[s].conn===conn)delete RKS.rooms[s];if(conn===net.conn)onPeerGone();});
    conn.on('error',()=>{});
    setTimeout(()=>{if(!conn.open&&RKS.conns[s]===conn){try{conn.close();}catch(e){}delete RKS.conns[s];}},4500);
  }
}
function rkConnMsg(conn,m,slot){
  if(!m||typeof m!=='object')return;
  if(conn===net.conn){netMsg(m);return;}
  switch(m.t){
    case'rinfo':RKS.rooms[slot]={slot,rp:clamp(m.rp|0,0,9999),map:clamp(m.map|0,0,MAPS.length-1),st:m.st?1:0,ok:m.b===BUILD,conn};break;
    case'rfull':if(RKS.joining===conn){RKS.joining=null;RKS.msg='방이 이미 찼어요';}break;
    case'rver':if(RKS.joining===conn){RKS.joining=null;RKS.msg='버전이 달라요 — 두 사람 모두 새로고침(Ctrl+F5) 해 주세요';}break;
    case'rok':if(RKS.joining===conn)rkEnterLobby(conn,slot);break;
  }
}
function rkJoin(room){
  if(!room||!room.conn||!room.conn.open||RKS.joining)return;
  RKS.joining=room.conn;RKS.msg='입장하는 중...';
  try{room.conn.send({t:'rjoin',b:BUILD,rp:RK.rp,sk:skStr(RK.sk),n:RK.name,id:RK.id,c:RK.coin});}catch(e){RKS.joining=null;return;}
  setTimeout(()=>{if(RKS.joining===room.conn){RKS.joining=null;RKS.msg='응답이 없어요. 다시 시도해 주세요';}},6000);
}
function rkEnterLobby(conn,slot){
  const room=RKS.rooms[slot],peer=RKS.peer;
  for(const s in RKS.conns){if(RKS.conns[s]!==conn){try{RKS.conns[s].close();}catch(e){}}}
  RKS.conns={};RKS.rooms={};RKS.peer=null;RKS.joining=null;
  net.role='guest';net.peer=peer;net.conn=conn;net.connected=true;net.code='RK'+slot;net.slot=slot;net.status='연결됨';net.verBad=false;net.hiSent=false;net.rkSent=false;net.byeRecv=false;net.pings=[];
  net.opp={rp:room?room.rp:0,sk:[]};net.oppSk=net.opp.sk;
  APP.ranked=true;APP.mode='guest';APP.cfg={map:room?room.map:0,bo:3,w:[0,APP.cfg.w[1]],bot:1};APP.vote=[APP.cfg.map,APP.cfg.map];APP.rkN=0;APP.rdy=[false,false];APP.rkRes=null;APP.rkGoT=0;APP.scene='rklobby';
}

function rkCoinWin(){
  let n=0;const m=APP.mode;
  if(m==='host'||m==='guest')n=APP.ranked?50:30;else if(m==='bot')n=[4,8,12][APP.cfg.bot|0]||4;
  if(n>0){RK.coin+=n;rkSave();}
  APP.coinGot=n;APP.coinDone=1;return n;
}
function buyBox(i){
  const B=BOXES[i];if(!B||RK.coin<B.p||(SHOP.res&&performance.now()-SHOP.t<1500))return;
  RK.coin-=B.p;
  let roll=Math.random()*100,r=0,acc=0;for(let q=0;q<4;q++){acc+=B.odds[q];if(roll<acc){r=q;break;}}
  const pool=[];for(let s=1;s<SKINS.length;s++)if(SKINS[s].box&&SKINS[s].r===r)pool.push(s);
  const s=pool[(Math.random()*pool.length)|0],dup=RK.own.indexOf(s)>=0;
  if(dup)RK.coin+=REFUND[r];else RK.own.push(s);
  rkSave();SHOP.res={s,dup,refund:dup?REFUND[r]:0,box:i};SHOP.t=performance.now();
}

function rkMeet(o){
  if(!o||!o.id||o.id===RK.id)return;
  let e=null;for(const q of RK.book)if(q.id===o.id)e=q;
  if(!e){e={id:o.id};RK.book.push(e);}
  e.n=o.n||'이름 없음';e.rp=o.rp;e.c=o.c;e.t=Date.now();

  btn(40,366,44,44,'◀',()=>setMap((APP.cfg.map+MAPS.length-1)%MAPS.length),{size:20,col:'#f1d9a8',dark:'#c9ae78',r:10,lip:4});
  btn(88,366,264,44,'',()=>setMap((APP.cfg.map+1)%MAPS.length),{col:'#ffe9b8',dark:'#d4a954',r:10,lip:4});
  miniMap(APP.cfg.map,94,370,54,36);txt(mp.n,152+99,388,17,'#3b2210',null,'800');
  btn(356,366,44,44,'▶',()=>setMap((APP.cfg.map+1)%MAPS.length),{size:20,col:'#f1d9a8',dark:'#c9ae78',r:10,lip:4});
  txt('승리 조건',410,358,12,'#5a3a1e','left','800');
  btn(410,366,140,44,'3판 2선승',()=>setBo(2),{size:16,sel:APP.cfg.bo===2,col:APP.cfg.bo===2?'#ffe9b8':'#ead0a0',dark:'#b98448',r:10,lip:4});
  btn(560,366,140,44,'5판 3선승',()=>setBo(3),{size:16,sel:APP.cfg.bo===3,col:APP.cfg.bo===3?'#ffe9b8':'#ead0a0',dark:'#b98448',r:10,lip:4});
  if(bot){
    txt('봇 난이도',730,358,12,'#5a3a1e','left','800');
    for(let i=0;i<3;i++)btn(730+i*64,366,60,44,BOTLV[i],()=>{APP.cfg.bot=i;},{size:14,sel:APP.cfg.bot===i,col:APP.cfg.bot===i?'#ffe9b8':'#ead0a0',dark:'#b98448',r:10,lip:4});
  }
  if(guest){
    if(!net.connected&&bad)btn(280,440,400,58,'코드 다시 입력',()=>{leaveNet(false);APP.joinCode='';APP.mode='bot';APP.scene='join';},{size:22,icon:'join',col:'#ffd9a8'});
    else btn(280,440,400,58,'방장이 시작하길 기다리는 중...',()=>{},{enabled:false,size:20,col:'#e8c88f'});
  }else{
    const can=!host||(net.connected&&!net.verBad);
    btn(300,440,360,58,host&&!net.connected?'친구를 기다리는 중...':'대결 시작!',()=>{if(can)startMatch();},{enabled:can,col:'#8fd18a',dark:'#5a9c55',size:host&&!net.connected?20:28,icon:'play'});
  }
}
function statRow(y,label,a,b,hl){
  txt(label,480,y,15,'#7a5a3a');
  txt(a,330,y,hl===0?24:20,hl===0?'#2e8b4a':'#3b2210',null,'900');txt(b,630,y,hl===1?24:20,hl===1?'#2e8b4a':'#3b2210',null,'900');
}
function drawResult(){
  const S=APP.S;if(!S)return;
  ctx.fillStyle='rgba(30,16,6,.62)';ctx.fillRect(0,0,W,H);
  const cx=W/2,w=560,x=cx-w/2,y=64,h=412;
  ctx.fillStyle='rgba(50,25,8,.3)';rr(x+4,y+8,w,h,22);ctx.fill();
  ctx.fillStyle='#f6e6c2';rr(x,y,w,h,22);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#6b4423';ctx.stroke();
  const win=S.winner,online=APP.mode==='host'||APP.mode==='guest',me=APP.mode==='guest'?1:0;
  let head,col;
  if(win<0){head='무승부';col='#7a6a4a';}
  else if(APP.mode==='local'){head=(win+1)+'P 승리!';col=PCOL[win].b;}
  else if(win===me){head='승리!';col='#3a9d5d';}else{head='패배…';col='#c9503f';}
  ctx.fillStyle=col;rr(cx-180,y-26,360,64,16);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
  txt(head,cx,y+8,40,'#fff',null,'900',{w:6,c:'rgba(0,0,0,.25)'});
  const names=APP.mode==='bot'?['나','봇']:online?(me===0?['나','상대']:['상대','나']):['1P','2P'];
  txt(MAPS[S.map].n+' · '+S.bo+'선승 · '+S.round+'라운드',cx,y+62,16,'#5a3a1e');
  ctx.fillStyle=PCOL[0].b;rr(330-50,y+86,100,28,14);ctx.fill();txt(names[0],330,y+100,16,'#fff');
  ctx.fillStyle=PCOL[1].b;rr(630-50,y+86,100,28,14);ctx.fill();txt(names[1],630,y+100,16,'#fff');
  const pct=i=>S.st.sh[i]?Math.round(100*S.st.ht[i]/S.st.sh[i])+'%':'-';
  const dm=i=>String(Math.round(S.st.dm[i]));
  statRow(y+148,'라운드 승',String(S.score[0]),String(S.score[1]),S.score[0]>S.score[1]?0:(S.score[1]>S.score[0]?1:-1));
  if(APP.coinGot>0){coinPill(x+w-132,y+46,120,26,'+'+APP.coinGot,'#ffe08a');}
  const rk=APP.ranked&&APP.rkRes;
  if(!rk)statRow(y+190,'명중률',pct(0),pct(1),(S.st.sh[0]&&S.st.sh[1])?(S.st.ht[0]/S.st.sh[0]>S.st.ht[1]/S.st.sh[1]?0:1):-1);
  statRow(rk?y+190:y+232,'가한 피해',dm(0),dm(1),S.st.dm[0]>S.st.dm[1]?0:(S.st.dm[1]>S.st.dm[0]?1:-1));
  statRow(rk?y+232:y+274,'패링 성공',String(S.st.pa[0]),String(S.st.pa[1]),S.st.pa[0]>S.st.pa[1]?0:(S.st.pa[1]>S.st.pa[0]?1:-1));
  if(rk)rkResultBox(cx,y+262);
  if(APP.oppLeft){
    txt(APP.rkWhy||'상대가 나갔어요',cx,y+332,APP.rkWhy?16:20,'#b3261e');
    btn(cx-100,y+352,200,48,'메뉴로',goMenu,{icon:'home',size:20});
  }else{
    const waiting=online&&APP.rematch[LS.slot]&&!APP.rematch[1-LS.slot];
    if(online&&APP.rematch[1-LS.slot]&&!APP.rematch[LS.slot])txt('상대가 다시 하자고 해요!',cx,y+328,16,'#2e8b4a');
    if(waiting)txt('상대를 기다리는 중…',cx,y+328,16,'#5a3a1e');
    btn(cx-250,y+344,240,56,waiting?'기다리는 중…':'다시 대결',askRematch,{icon:'retry',col:'#8fd18a',dark:'#5a9c55',size:22,enabled:!waiting});
    btn(cx+10,y+344,240,56,'로비로',backToLobby,{icon:'home',size:22});
  }
}
function drawOppLeft(){
  if(APP.scene!=='play')return;
  ctx.fillStyle='rgba(30,16,6,.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f6e6c2';rr(W/2-190,190,380,170,20);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#6b4423';ctx.stroke();
  txt('상대가 나갔어요',W/2,232,30,'#b3261e',null,'900');
  if(APP.rkWhy)txt(APP.rkWhy,W/2,266,15,'#5a3a1e',null,'800');
  if(APP.rkRes)txt((APP.rkRes.d>0?'+':'')+APP.rkRes.d+' RP',W/2,288,18,'#2e8b4a',null,'900');
  btn(W/2-100,298,200,52,'메뉴로',goMenu,{icon:'home',size:22});
}
function drawRotate(){
  ctx.save();ctx.fillStyle='rgba(20,12,6,.95)';ctx.fillRect(0,0,SW,SH);
  const cx=SW/2,cy=SH*.36,a=-Math.PI/2*(.5+.5*Math.sin(ANIM*2));
  ctx.translate(cx,cy);ctx.rotate(a);ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.fillStyle='#3b2210';rr(-26,-46,52,92,12);ctx.fill();ctx.stroke();
  ctx.fillStyle='#e8893a';rr(-19,-36,38,64,5);ctx.fill();ctx.restore();
  ctx.save();const fs=Math.max(18,Math.min(30,SW*.065));
  txt('화면을 가로로 돌려 주세요',cx,cy+90,fs,'#fff');txt('세로에서는 게임 화면이 너무 작아요',cx,cy+90+fs*1.5,Math.max(13,fs*.6),'#d9c49c','center','600');
  const bw=190,bh=46,bx=cx-bw/2,by=cy+90+fs*3;ROT_BTN={x:bx,y:by,w:bw,h:bh};
  ctx.fillStyle='#e8b068';rr(bx,by,bw,bh,14);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#6b4423';ctx.stroke();txt('그냥 계속하기',cx,by+bh/2+1,18,'#3b2210');ctx.restore();
}
function drawErr(){
  if(performance.now()>ERR.until)return;
  const w=Math.min(SW-24,440),x=(SW-w)/2,y=SH-64;
  ctx.save();ctx.fillStyle='rgba(120,20,12,.92)';rr(x,y,w,48,12);ctx.fill();
  txt('문제가 생겼어요. 새로고침하면 해결될 수 있어요',SW/2,y+17,14,'#fff');txt(ERR.msg,SW/2,y+35,11,'#ffd0c8','center','500');ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#1d140d';ctx.fillRect(0,0,SW,SH);
  ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  buttons=[];HOVER=false;
  switch(APP.scene){
    case'menu':drawMenu();break;
    case'join':drawJoin();break;
    case'lobby':drawLobby();break;
    case'rk':drawRk();break;
    case'rkrooms':drawRkRooms();break;
    case'rkskin':drawRkSkin();break;
    case'rklobby':drawRkLobby();break;
    case'shop':drawShop();break;
    case'board':drawBoard();break;
    default:drawArena();if(APP.scene==='result')drawResult();if(APP.oppLeft)drawOppLeft();
  }
  ctx.restore();
  if(IS_TOUCH&&APP.scene==='play'&&!APP.paused&&!APP.oppLeft)drawTouch();
  if(PORTRAIT&&!portraitOK)drawRotate();else ROT_BTN=null;
  drawErr();
  cv.style.cursor=HOVER?'pointer':'default';
}

/* ---------- 메인 루프 ---------- */
function localPump(dt){
  APP.acc=Math.min(APP.acc+dt,.2);let n=0;
  while(APP.acc>=PV.DT&&n<6){
    let i0,i1;
    if(APP.mode==='local'){i0=sampleP1();i1=sampleP2();}
    else{i0=sampleLocal();i1=botInput(APP.S,1,APP.bots[1]);}
    clearLatch();
    simStep(APP.S,[i0,i1]);APP.acc-=PV.DT;n++;drainEv();
  }
}
function update(dt){
  ANIM+=dt;updateFx(dt);updateAim(dt);
  if(APP.leaveArm>0)APP.leaveArm=Math.max(0,APP.leaveArm-dt);
  const S=APP.S;
  if(APP.scene==='rkrooms'&&RKS.peer&&performance.now()>RKS.next){RKS.next=performance.now()+5000;rkScanRound();}
  if(APP.scene==='rklobby'&&APP.mode==='host'){
    const both=APP.rdy[0]&&APP.rdy[1]&&net.connected&&!net.verBad;
    if(both){if(!APP.rkGoT)APP.rkGoT=ANIM+3.2;else if(ANIM>=APP.rkGoT){APP.rkGoT=0;startMatch();}}else APP.rkGoT=0;
  }
  if(S&&(APP.scene==='play')&&!APP.paused&&!APP.oppLeft){
    if(APP.mode==='host'||APP.mode==='guest'){if(LS.on)lsPump(dt);}
    else localPump(dt);
    if(S.phase==='fight')APP.secs=Math.max(0,Math.ceil(S.pt/60));
    if(S.phase==='mend'){
      APP.endT+=dt;
      if(APP.endT>1.8){
        APP.scene='result';
        const me=APP.mode==='guest'?1:0;
        if(APP.ranked&&!APP.rkRes&&RK.pend)APP.rkRes=rkSettle(S.winner<0?-1:(S.winner===me?1:0));
        if(!APP.coinDone&&S.winner>=0&&APP.mode!=='local'&&S.winner===me)rkCoinWin();APP.coinDone=1;
        if(S.winner<0)playSfx('beep');else if(APP.mode==='local'||S.winner===me)playSfx('win');else playSfx('lose');
      }
    }
  }
}
let lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;
  try{update(dt);draw();}catch(e){reportErr(e);try{cv.width=cv.width;}catch(_){}}
}
bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;paintBG(bgc.getContext('2d'));
requestAnimationFrame(frame);

</script></body></html>
